services:
  - type: web
    name: daityou-bridge-management
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daityou-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: daityou-db
    databaseName: bridge_management
    user: bridge_admin
    plan: free
