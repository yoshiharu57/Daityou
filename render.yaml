databases:
  - name: construction-pm-db
    databaseName: construction_pm
    user: cpms_user
    plan: free

services:
  - type: web
    name: construction-pm
    env: python
    plan: free
    pythonVersion: "3.11.0"
    buildCommand: bash render-build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: construction-pm-db
          property: connectionString
